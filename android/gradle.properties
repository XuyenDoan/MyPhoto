org.gradle.jvmargs=-Xmx2048m
# Lets `gradle :core:...` configure (and build/test) the pure-Kotlin :core
# module without touching :app's Android Gradle Plugin — useful in sandboxes
# without access to dl.google.com/maven.google.com. See android/README.md.
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
