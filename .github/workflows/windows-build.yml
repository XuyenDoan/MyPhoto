name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "presets/**"
      - "models/**"
      - "myphoto.spec"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        run: pyinstaller myphoto.spec --noconfirm

      - name: Upload MyPhoto.exe
        uses: actions/upload-artifact@v4
        with:
          name: myphoto-windows-exe
          path: dist/MyPhoto
          if-no-files-found: error
